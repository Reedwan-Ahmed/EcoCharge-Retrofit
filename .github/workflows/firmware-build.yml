name: Firmware build
on:
  push:
    paths: ["firmware/**", ".github/workflows/firmware-build.yml"]
  pull_request:
    paths: ["firmware/**", ".github/workflows/firmware-build.yml"]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install PlatformIO
        run: pip install platformio
      - name: Compile ESP32 scaffold
        working-directory: firmware
        run: pio run
